<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pragya-Edu | Sign In</title>
  <meta name="description" content="Pragya-Edu - Personalized Engagement and Curiosity Engine for Students">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="./css/style.css" rel="stylesheet">
</head>
<body class="login-page">
  <div style="position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;">
    <div style="position:absolute;top:-20%;right:-10%;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,0.12),transparent 70%);animation:floating 8s ease-in-out infinite;"></div>
    <div style="position:absolute;bottom:-15%;left:-5%;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(236,72,153,0.10),transparent 70%);animation:floating 10s ease-in-out infinite 2s;"></div>
  </div>

  <div class="login-card animate-fade-in-up" style="position:relative;z-index:1;">
    <div class="d-flex align-items-center gap-3 mb-4">
      <div class="logo-mark"><i class="fa-solid fa-brain"></i></div>
      <div>
        <h1 class="gradient-text mb-0" style="font-size:1.6rem;font-weight:900;letter-spacing:-0.5px;">Pragya-Edu</h1>
        <p style="font-size:0.72rem;color:rgba(15,23,42,0.5);text-transform:uppercase;letter-spacing:0.08em;margin:0;">Curiosity Engine &bull; Student Edition</p>
      </div>
    </div>

    <div class="divider-edu"></div>

    <div id="roleToggle" class="pill-toggle mb-4" style="width:100%;">
      <button class="active" onclick="setRole('student',this)" id="btnStudent"><i class="fa-solid fa-graduation-cap me-1"></i>Student</button>
      <button onclick="setRole('teacher',this)" id="btnTeacher"><i class="fa-solid fa-chalkboard-user me-1"></i>Teacher</button>
    </div>

    <div class="mb-3">
      <label class="label-edu"><i class="fa-solid fa-user me-1"></i>Your Name</label>
      <input id="userName" class="input-edu" type="text" placeholder="e.g. Aarav Mehta" autocomplete="name">
    </div>

    <div class="mb-3">
      <label class="label-edu"><i class="fa-solid fa-book me-1"></i>Subject / Topic of Interest</label>
      <input id="userTopic" class="input-edu" type="text" placeholder="e.g. Physics, World War II, Data Science" list="topicList">
      <datalist id="topicList">
        <option value="Physics - Waves & Optics">
        <option value="Mathematics - Calculus">
        <option value="History - Ancient Civilizations">
        <option value="Biology - Cell Division">
        <option value="Computer Science - Algorithms">
        <option value="Chemistry - Periodic Table">
        <option value="Economics - Supply & Demand">
        <option value="Literature - Shakespeare">
      </datalist>
    </div>

    <div class="mb-4">
      <label class="label-edu"><i class="fa-solid fa-language me-1"></i>Language</label>
      <select id="userLang" class="input-edu">
        <option value="en">English</option>
        <option value="hi">Hindi</option>
      </select>
    </div>

    <button class="btn-edu-brand w-100" onclick="startSession()" id="startBtn">
      <i class="fa-solid fa-rocket me-2"></i>Launch My Learning Experience
    </button>

    <div class="mt-3 text-center" style="font-size:0.78rem;color:rgba(15,23,42,0.4);">
      No account needed &bull; Privacy-first &bull; Works offline
    </div>
  </div>

  <script>
    let currentRole = 'student';
    function setRole(role, btn) {
      currentRole = role;
      document.querySelectorAll('.pill-toggle button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function startSession() {
      const name = document.getElementById('userName').value.trim();
      const topic = document.getElementById('userTopic').value.trim();
      const lang = document.getElementById('userLang').value;
      if (!name || !topic) { showToast('Please fill in your name and topic!', 'warning'); return; }

      const btn = document.getElementById('startBtn');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Launching...';
      btn.disabled = true;

      localStorage.setItem('pe_name', name);
      localStorage.setItem('pe_topic', topic);
      localStorage.setItem('pe_lang', lang);
      localStorage.setItem('pe_role', currentRole);
      localStorage.setItem('pe_score', '0');
      localStorage.setItem('pe_level', 'Explorer');

      setTimeout(() => {
        window.location.href = currentRole === 'teacher' ? 'vibe-analytics.html' : 'vibe-check.html';
      }, 800);
    }

    function showToast(msg, type='info') {
      const el = document.createElement('div');
      el.className = 'toast-edu';
      el.innerHTML = '<i class="fa-solid fa-circle-info" style="color:var(--edu-amber);font-size:1.2rem;flex-shrink:0;"></i><span>' + msg + '</span>';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') startSession(); });
  </script>
</body>
</html>
